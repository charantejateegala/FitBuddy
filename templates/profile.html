{% extends 'base.html' %}
{% block content %}
<div style="max-width: 650px; margin: 0 auto;">
  <div class="card">
    <h2 style="margin-bottom: 1.5rem; font-size: 1.5rem;">Profile Settings</h2>
    <form method="POST">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="name" class="form-control" value="{{ current_user.name }}" required>
      </div>

      <div class="form-group">
        <label>City</label>
        <input type="text" name="city" class="form-control" value="{{ current_user.city }}" required>
      </div>

      <div class="grid-2" style="gap: 1rem;">
        <div class="form-group">
          <label>Primary Discipline</label>
          <select name="activity" class="form-control">
            <option value="Gym" {% if current_user.activity == 'Gym' %}selected{% endif %}>Gym / Weights</option>
            <option value="Running" {% if current_user.activity == 'Running' %}selected{% endif %}>Running</option>
            <option value="Cycling" {% if current_user.activity == 'Cycling' %}selected{% endif %}>Cycling</option>
            <option value="Yoga" {% if current_user.activity == 'Yoga' %}selected{% endif %}>Yoga</option>
          </select>
        </div>
        <div class="form-group">
          <label>Level</label>
          <select name="level" class="form-control">
            <option value="Beginner" {% if current_user.level == 'Beginner' %}selected{% endif %}>Beginner</option>
            <option value="Intermediate" {% if current_user.level == 'Intermediate' %}selected{% endif %}>Intermediate</option>
            <option value="Advanced" {% if current_user.level == 'Advanced' %}selected{% endif %}>Advanced</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Preferred Workout Time</label>
        <input type="text" name="workout_time" class="form-control" value="{{ current_user.workout_time }}">
      </div>

      <div class="form-group">
        <label>Fitness Bio</label>
        <textarea name="bio" rows="4" class="form-control">{{ current_user.bio }}</textarea>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%;">Save Changes</button>
    </form>
  </div>
</div>
{% endblock %}
